---
include:
  - project: tpo/tpa/ci-templates
    file: debtpo.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

variables:
  DOCKER_REGISTRY_URL: docker.io
  STORAGE_DRIVER: vfs
  BUILDAH_FORMAT: docker
  FQ_IMAGE_NAME: "${DOCKER_REGISTRY_URL}/thetorproject/webtunnel-bridge"

stages:
  - test
  - build
  - release
  - container

unit_test:
  image: ${DOCKER_REGISTRY_URL}/golang:1.24-bookworm
  stage: test
  variables:
    GOARCH: amd64
  tags:
    - amd64
  script: ./release/test.sh

unit_test_arm64:
  extends: unit_test
  variables:
    GOARCH: arm64
  tags:
    - arm64

binary_build:
  stage: build
  image:
    name: ${DOCKER_REGISTRY_URL}/goreleaser/goreleaser
    entrypoint: [""]
  variables:
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]
      then
        goreleaser release --snapshot --clean
      else
        goreleaser release --clean --skip publish
        cp release/control.changes dist
      fi
  artifacts:
    name: "${CI_PROJECT_PATH}_${CI_JOB_STAGE}_${CI_JOB_ID}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHA}"
    paths:
      - dist/
    expire_in: 1 week

upload:
  extends: .debtpo
  stage: release
  before_script:
    # generate .changes files for each .deb package
    - apt install -Uy devscripts dpkg-dev
    - mkdir debian dupload
    - mv dist/control.changes debian/control
    - |
      for d in dist/*.deb; do
        DEB_VERSION=$(dpkg-deb --field "$d" Version)
        DEB_PACKAGE=$(dpkg-deb --field "$d" Package)
        DEB_SECTION=$(dpkg-deb --field "$d" Section)
        DEB_PRIORITY=$(dpkg-deb --field "$d" Priority)
        DEB=$(basename "$d")
        DEB_CHANGES="$(echo "$d" | sed 's,\.deb,.changes,')"
        rm -f debian/changelog
        dch --create --package "${DEB_PACKAGE}" -v"${DEB_VERSION}" --controlmaint -Dunstable "Package built with GoReleaser."
        echo "${DEB} ${DEB_SECTION} ${DEB_PRIORITY}" > debian/files
        dpkg-genchanges -b -udist > "${DEB_CHANGES}"
      done
    - mv dist/*.{changes,deb} dupload
  rules:
    - if: $TORDEB_SSH_PRIVATE_KEY && $CI_COMMIT_TAG

.resolve-tag: &resolve-tag |
  if [ "$CI_COMMIT_REF_NAME" = "main" ]; then export TAG=nightly; fi

.podman-login: &podman-login
  podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build_server_container:
  stage: container
  image: containers.torproject.org/tpo/tpa/base-images/podman:stable
  variables:
    TAG: $CI_COMMIT_TAG
  parallel:
    matrix:
      - ARCH: amd64
      - ARCH: arm64
  tags:
    - $ARCH
  script:
    - *resolve-tag
    - podman build --platform=linux/$ARCH -t $CI_REGISTRY_IMAGE:${TAG}_${ARCH} .
    - *podman-login
    - podman push $CI_REGISTRY_IMAGE:${TAG}_${ARCH}
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_TAG

merge_server_container_manifest:
  stage: container
  image: containers.torproject.org/tpo/tpa/base-images/podman:stable
  variables:
    TAG: $CI_COMMIT_TAG
  needs:
    - job: build_server_container
      artifacts: false
  script:
    - *resolve-tag
    - *podman-login
    - podman manifest create $CI_REGISTRY_IMAGE:${TAG}
    - podman manifest add $CI_REGISTRY_IMAGE:${TAG} docker://$CI_REGISTRY_IMAGE:${TAG}_amd64
    - podman manifest add $CI_REGISTRY_IMAGE:${TAG} docker://$CI_REGISTRY_IMAGE:${TAG}_arm64
    - podman manifest push --all $CI_REGISTRY_IMAGE:${TAG}
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: always
    - if: $CI_COMMIT_TAG
      when: always

tag_server_container_release:
  stage: container
  image: containers.torproject.org/tpo/tpa/base-images/podman:stable
  needs:
    - job: merge_server_container_manifest
      artifacts: false
  script:
    - *podman-login
    - podman manifest create tmp-latest
    - podman manifest add --all tmp-latest docker://$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
    - podman manifest push --all tmp-latest docker://$CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: always
