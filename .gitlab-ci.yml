---
include:
  - project: tpo/tpa/ci-templates
    file: debtpo.yml

variables:
  DOCKER_REGISTRY_URL: docker.io

stages:
  - test
  - build
  - release
  - container

unit_test:
  image: ${DOCKER_REGISTRY_URL}/golang:1.24-bookworm
  stage: test
  variables:
    GOARCH: amd64
  tags:
    - amd64
  script: ./release/test.sh

unit_test_arm64:
  extends: unit_test
  variables:
    GOARCH: arm64
  tags:
    - arm64

binary_build:
  stage: build
  image:
    name: ${DOCKER_REGISTRY_URL}/goreleaser/goreleaser
    entrypoint: [""]
  variables:
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script:
    - |
      if [ -z "$CI_COMMIT_TAG" ]
      then
        goreleaser release --snapshot --clean
      else
        goreleaser release --clean --skip publish
      fi
  artifacts:
    name: "${CI_PROJECT_PATH}_${CI_JOB_STAGE}_${CI_JOB_ID}_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHA}"
    paths:
      - dist/
      - release/control.changes
    expire_in: 1 week

upload:
  extends: .debtpo
  stage: release
  before_script:
    - mkdir -p debian
    - mv release/control.changes debian/control
    # generate .changes files for each .deb package
    - !reference [.debtpo-scripts, genchanges]
  rules:
    - if: $TORDEB_SSH_PRIVATE_KEY && $CI_COMMIT_TAG

build-server-container:
  stage: container
  image: containers.torproject.org/tpo/tpa/base-images/podman:stable
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_FORMAT: docker
    FQ_IMAGE_NAME: "${DOCKER_REGISTRY_URL}/thetorproject/webtunnel-bridge"
  script:
    - podman build -t $FQ_IMAGE_NAME .
    - mkdir -p container_image
    - podman push $FQ_IMAGE_NAME docker-archive:container_image/webtunnel-server.tar
  artifacts:
    paths:
      - container_image/webtunnel-server.tar
